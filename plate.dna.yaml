# DNApps capsule. Spec: https://meshkore.com/dnapps
# Hand this file to your coding agent:
#   "Build the app described in plate.dna.yaml
#    following the DNApps standard at https://meshkore.com/dnapps/spec.md.
#    The capsule includes a conformance kit: follow builder.loop and keep
#    fixing the app until node tests/conformance.mjs passes."
#
# Plate is the nutrition part of Evolvea, a personal fitness app with gym,
# cycling, nutrition and an AI coach, split out as a small app of its own.
# It's a good example because it uses a bit of everything: the camera, an AI
# vision model with the person's own API key, health data, offline storage,
# charts, dictation and two languages.
appdna: "0.1"

identity:
  id: "com.meshkore.examples.plate"
  name: "Plate"
  summary: "Photograph what you eat; a vision model estimates calories and macros, and you see each day and month against your goal."
  version: "1.3.1"
  visibility: public
  license: MIT
  authors: [{ name: "MeshKore", contact: "https://meshkore.com/contact" }]
  lineage:
    forked_from: "Evolvea (personal fitness PWA: gym, cycling, nutrition, AI coach)"
    changes: "Only the nutrition module. Gym, cycling, wearables and the proactive coach are left out."

purpose:
  problem: "Counting calories by hand is so tedious that people stop after a week."
  for: ["adults who want to gain, lose or keep weight", "people who track protein for training"]
  outcomes:
    - "Logging a meal takes one photo or one sentence"
    - "At any moment the person knows how much is left for today"
    - "Each week they get a plain-language review of how they ate"
  non_goals:
    - "Medical or clinical nutrition advice"
    - "Gym, cycling or wearable tracking (other Evolvea capsules)"
    - "Social feeds, streaks, badges or guilt mechanics"

features:
  - id: F1
    title: "Log a meal from a photo"
    priority: must
    acceptance:
      - "GIVEN a photo of a plate WHEN the person saves it THEN the meal appears at once as 'analyzing' and within 20 s shows a short name, grams, kcal, protein, carbs, fat, fiber, a 1-5 quality score and a confidence"
      - "GIVEN a photo of a packaged product with a readable label WHEN analyzed THEN the values come from the label per 100 g multiplied by the net weight"
      - "GIVEN a photo with no food in it WHEN analyzed THEN no meal is invented: the person is told it is not food"
  - id: F2
    title: "Log a meal from text or dictation"
    priority: must
    acceptance:
      - "GIVEN the sentence 'two fried eggs and a slice of wholemeal toast' WHEN saved THEN it is logged with the same fields as F1"
  - id: F3
    title: "Photo + words in one estimate"
    priority: must
    acceptance:
      - "GIVEN a photo of a pizza AND the words 'wholemeal base, half of it' WHEN analyzed THEN the name, portion and macros reflect both; where they disagree the words win"
  - id: F4
    title: "Correct a meal"
    priority: must
    acceptance:
      - "GIVEN a logged meal WHEN the person edits any number or the time THEN totals update immediately"
      - "GIVEN a logged meal WHEN the person adds a correction in words THEN it is re-analyzed with the original photo plus the correction"
      - "GIVEN an analysis that failed WHEN the person taps retry THEN it is analyzed again without retaking the photo"
  - id: F5
    title: "Today against the goal"
    priority: must
    acceptance:
      - "GIVEN a profile and today's meals WHEN the person opens the app THEN they see kcal eaten vs target, protein/carbs/fat vs target and a quality bar colored by the day's average score"
  - id: F6
    title: "Trends"
    priority: should
    acceptance:
      - "GIVEN 30 days of meals WHEN the person opens trends THEN they see daily kcal vs target, the daily surplus or deficit, and daily quality, each with a text alternative"
      - "GIVEN weight entries WHEN trends are open THEN weight over 30 days is shown on the same time axis"
  - id: F7
    title: "Weekly review"
    priority: should
    acceptance:
      - "GIVEN 7 days of meals WHEN the person asks for a review THEN they get a 0-100 score, a short summary, strengths, issues and up to 3 prioritized recommendations, in their language"
  - id: F8
    title: "Own your data"
    priority: must
    acceptance:
      - "GIVEN any meals WHEN the person exports THEN they get a CSV with every meal and its numbers"
      - "GIVEN any data WHEN the person deletes everything THEN meals, photos, profile and key are gone from the device"
  - id: F10
    title: "Usable without a model key"
    priority: must
    acceptance:
      - "GIVEN no API key WHEN the person logs a meal THEN they can type the numbers by hand, and the app shows where to add a key to unlock photo estimates"
  - id: F9
    title: "Install and work offline"
    priority: must
    acceptance:
      - "GIVEN no connection WHEN the person logs a photo THEN it is saved and analyzed automatically once back online"
      - "GIVEN a supporting browser WHEN the person installs it THEN it runs from the home screen as a standalone app"
      - "GIVEN a new version of the app is published WHEN the person opens it THEN the new version runs at the latest on the next launch, never an old copy forever. The service worker's cache name is plate-<identity.version>-<hash>, where <hash> is the first 12 hex characters of the sha256 of the files it caches, read in the order sw.js lists them. Any change to a cached file changes the name. The conformance kit recomputes it from the files on disk"

data:
  entities:
    - name: Meal
      fields: [eaten_at, source, description, grams, calories, protein_g, carbs_g, fat_g, fiber_g, health_score, health_reason, confidence, status, source_text, source_image]
      owner: person
    - name: Profile
      fields: [weight_kg, height_cm, age, sex, goal, target_weight_kg, protein_per_kg, surplus_pct, target_calories, target_protein_g, target_carbs_g, target_fat_g]
      owner: person
    - { name: WeightEntry, fields: [date, weight_kg], owner: person }
    - { name: Review, fields: [period_start, period_end, score, summary, strengths, issues, recommendations], owner: person }
  rules:
    - "Targets: derived from the profile (Mifflin-St Jeor resting energy × activity, ± surplus_pct by goal; protein = protein_per_kg × weight) unless the person types their own"
    - "Profile defaults on first run: goal maintain, activity factor 1.55, protein_per_kg 2.0, surplus_pct 15 (applied only for gain/lose)"
    - "Meal status: pending → done | failed. A failed meal keeps its photo and text so it can be retried"
    - "Photos are downscaled on the device (longest side ≤ 1024 px) before being sent or stored"
  retention: { meals: "until the person deletes them", photos: { is: "until the person deletes them", mode: adapt, why: "Some people prefer to drop photos after analysis" } }
  sync: { is: none, mode: adapt, alternatives: ["the person's own cloud (Cloudflare D1, iCloud…)"] }

platforms:
  targets:
    is: [web]
    mode: preferred
    why: "One codebase for every phone and computer; installable as a PWA. A native iOS or Android build is a valid expression."
    alternatives: [ios, android]
  install: { is: pwa, mode: preferred }
  offline: { is: required, mode: fixed, why: "Meals are logged at the table, often with bad signal" }

  run:
    is: "double-click index.html: no server, no build, no install"
    mode: fixed
    why: "Anyone must be able to try the result. So: classic <script> tags, no ES-module imports and no fetch of local files (both fail on file://). Camera, IndexedDB and the model API work from file://; install and the service worker activate only when served over https or localhost."
  serve: { is: "npx serve . (or any static server)", mode: preferred, why: "For the installable PWA" }

stack:
  language: { is: javascript, mode: adapt }
  framework:
    is: "none, just the web platform (Evolvea uses Alpine.js with no build step)"
    mode: adapt
    why: "Keep the double-click run. A framework with a build (SolidJS, Astro…) is acceptable only if the built output still opens with a double-click."
    alternatives: [solidjs, astro, alpinejs]
  database: { is: indexeddb, mode: preferred, why: "On-device, single person, offline" }
  charts: { is: "inline SVG", mode: adapt, why: "No chart library needed for three line/bar charts" }
  vision_model:
    is: "any vision-capable model with JSON output"
    mode: adapt
    why: "The person picks provider and model; the app must not depend on one vendor"
    alternatives: ["OpenAI GPT mini vision", "Google Gemini Flash", "Anthropic Claude"]
    rule: "Default model ids MUST be checked against each provider's current model list at build time (not taken from memory) and recorded in the lock with the date checked and the page used as the source. Look the list up on the web (each provider's public models page or docs); the builder's own model name or its memory is not a source. If the lookup fails for a provider, the lock says checked: false and records the URL tried and the error. Never mark a model as checked without a source URL. The person can type any other model id in settings."

deploy:
  class: personal
  hosting: { is: static, mode: preferred, alternatives: [cloudflare-pages, github-pages, self-hosted, zaelar-os] }
  scale: { users: 1 }

integrations:
  - id: vision-llm
    service: "A vision language model API chosen by the person"
    use: "Estimate the meal from a photo and/or text (F1-F4) and write the weekly review (F7)"
    required: true
    why: "The core of the app. The person brings their own API key; it is stored only on their device and sent only to that provider."

permissions:
  - { capability: camera, use: "Photograph a meal", required: false, why: "F1; choosing a photo from the gallery works without it" }
  - { capability: microphone, use: "Dictate a meal", required: false, why: "F2; typing works without it" }
  - { capability: persistent-storage, use: "Ask the browser not to evict meals and photos", required: false, why: "F9" }
  - { capability: notifications, use: "Never requested in this capsule", required: false }
  - { capability: geolocation, use: "Never requested", required: false }

experience:
  intent: "Fast at the table, calm afterwards. One tap to the camera from anywhere. Numbers rounded to what is honest (kcal to 10, grams to 1)."
  screens:
    - { id: today, purpose: "Kcal and macros left for today, quality bar, today's meals" }
    - { id: capture, purpose: "Camera or gallery, optional words or dictation, save" }
    - { id: meal, purpose: "One meal: photo, estimate, confidence, edit, add a correction, retry" }
    - { id: trends, purpose: "30-day kcal vs target, surplus/deficit, quality, weight" }
    - { id: review, purpose: "The weekly review and its history" }
    - { id: settings, purpose: "Profile and goal, targets, model provider and key, export, delete everything" }
  design: { is: { density: compact, motion: minimal, theme: system }, mode: adapt }
  i18n:
    languages: { is: [en, es], mode: adapt, why: "Ship at least these two; add the person's own" }
    content_fixed_language: null
    notes: "Meal names and the review are generated in the person's language"
  accessibility:
    baseline: "WCAG 2.2 AA"
    modalities:
      output: [visual, audio]
      input: [touch, keyboard, voice]
    notes:
      - "Every screen starts with a visible heading"
      - "Every chart has a text or table alternative"
      - "The quality bar never relies on color alone: it also shows the score as a number"
      - "A meal can be logged entirely by voice, without the camera"

privacy:
  data_categories: [health, photos]
  stays_on: device
  shared_with: ["the vision model provider the person chooses, and only the meal photo or text being analyzed"]
  telemetry: none
  export: required

builder:
  unattended: true
  agent: "A capable coding agent with file, web and shell (node) access, such as Claude Code with Opus 5.5 or Codex. The loop below needs it to run node and a headless browser."
  defaults_without_profile:
    languages: [en, es]
    theme: system
    goal: maintain
    note: "If the person is present, the builder MAY ask about adapt/preferred genes (language, design, model provider). It MUST NOT block on an answer: without a profile or a reply it uses these defaults, finishes the build, and the person changes them later in settings. The capsule must build end-to-end without human input."
  deliverable:
    - "index.html: opens the working app with a double-click"
    - "The conformance kit, written verbatim from extensions.x-conformance.kit: tests/conformance.html, tests/conformance.js and tests/conformance.mjs. Byte for byte; the kit checks itself against this capsule"
    - "README.md: the two ways to run the app and how to run the conformance kit"
    - "plate.dna.lock.yaml: in the format of extensions.x-conformance.lock_format"
    - "Optional: tests/index.html with the builder's own unit tests. They help the loop but never replace the kit"
  loop: |
    The result is defined by the conformance kit, not by the builder's judgment. Work in rounds:
    1. Build or fix the app following the rna and the contract in extensions.x-conformance.contract.
    2. Write the kit files verbatim (first round only; afterwards never touch them).
    3. Install the browser once: npm i --no-save playwright && npx playwright install chromium
    4. Run: node tests/conformance.mjs. It serves the folder on localhost, runs every check and exits 0 only when all pass and none is skipped.
    5. For every failing check, read its message, find the cause in the app and fix the app. Never edit, skip or weaken a kit file, never special-case the test page, and never hard-code a fixture value into the app.
    6. Record the round in the lock (round number, passed, failed, ids still failing, what was fixed) and go back to step 4.
    Stop when the kit passes completely, or after 12 rounds. If a check still fails and you are sure the kit itself is wrong, do not change it: write the check id, the evidence and your reasoning under conformance.disputes in the lock. The build is done only with a clean run; otherwise report it as not conforming, with the ids that fail.
  done_when: "node tests/conformance.mjs exits 0: every check passes and none is skipped. The final message reports the last run's counts and the number of rounds."
  hygiene: "Leave no server or background process running when finished. node_modules may stay; it is not part of the app."

testing:
  levels: [unit, acceptance]
  from_features: true
  authority: "extensions.x-conformance.kit. It checks every acceptance line that can be observed, against the rendered app and the files on disk. The capsule author writes and versions it; builders run it and never change it."
  model_calls: "The kit replaces window.fetch inside the app with a fake provider that answers in each provider's documented response format. No check needs a real API key."
  live_check: "Optional: the README may explain how the person checks their own key by logging 'two fried eggs and a slice of wholemeal toast' (expect 300 to 500 kcal)."
  fixtures: "The kit draws its own photos and returns recorded estimates; real photos (plate, packaged product with label, not-food) are for the person's manual check"
  devices: { is: ["Safari on iOS", "Chrome on Android", "desktop Chrome"], mode: adapt }

extensions:
  x-estimation-rules:
    description: "Fixed behavior of the meal estimator, distilled from Evolvea's production prompt. Builders MUST keep these rules whatever model they use."
    output: { description: "4-6 words", ingredients: "[{item, grams, kcal, p, c, f}]", totals: "{grams, calories, protein_g, carbs_g, fat_g, fiber_g}", health_score: "1-5", health_reason: "≤ 60 chars", confidence: "0-1", notes: "assumptions made" }
    rules:
      - "Readable nutrition label: values per 100 g × the real net weight; if only part was eaten, estimate the part"
      - "Known commercial product without a readable label: use knowledge of the brand; never return 0 for a recognized product"
      - "Food on a plate: estimate portion from visual references (spoon ≈ 15 g, 25 cm plate) and standard food tables (USDA, BEDCA); say if meat/fish weight is raw or cooked"
      - "calories = 0 only when there is no food; then confidence = 0"
      - "confidence > 0.85 label or well-known product; 0.6-0.85 identified but estimated; < 0.6 high uncertainty"
      - "An error above 15 % in calories breaks the tracking: be decisive"
    health_score:
      "5": "Whole foods: fruit, vegetables, legumes, fresh fish, eggs, unsalted nuts, plain yoghurt, whole grains, water. Fruit is always 5; calorie-dense whole foods (avocado, olive oil, nuts) are not penalised"
      "4": "Healthy with light preparation: grilled lean meat, wholemeal bread, unsweetened dairy, boiled or air-fried potato"
      "3": "Neutral / occasional: white bread or rice, cured cheese, dark chocolate > 70 %, home-made sauce"
      "2": "Processed or fried: cold cuts, home baking, oil-fried food, industrial sauces, alcohol, sugary desserts"
      "1": "Ultra-processed: packaged pastries, fried snacks, sugary drinks, fast food, sweets, spirits"

  x-conformance:
    description: "How a build proves it is this app. The contract makes the app observable from outside; the kit checks it. Both are fixed."
    contract:
      mode: fixed
      why: "The kit drives the app through these hooks. Without them no build can be checked, and every build is a guess."
      routes: "Each screen in experience.screens opens at index.html#/<screen id>; one meal opens at #/meal/<meal id>. The visible screen's root element has data-screen=\"<screen id>\" and every other screen is hidden (hidden attribute or display:none). Navigation inside the app changes the hash the same way."
      language: "index.html?lang=<code> starts the app in that language and saves it as the person's choice. <html lang> always matches the language shown."
      ready: "After the first render, <html> gets data-ready=\"true\". Navigation and data changes re-render within 500 ms."
      test_seam: "window.DNA_TEST.seed(data) returns a Promise. It deletes everything, then stores data through the app's own store: { profile: {weight_kg, height_cm, age, sex, goal}, meals: [Meal fields], weights: [{date, weight_kg}], settings: {provider, model, api_key} }. Targets left out of a seeded profile are derived as usual. It is only for seeding; the kit reads results from the rendered document, never from the seam."
      hooks: |
        Elements carry data-dna="<name>". Number hooks contain only their number and an optional unit, as text (or as the value of an input).
        Navigation: nav-<screen id> for each screen.
        capture screen: photo-input (input type=file; choosing a file does not save), capture-text (the words), capture-save. With no key: manual-calories, manual-protein, manual-carbs, manual-fat, and add-key-link (an <a> with href containing #/settings). After capture-save the app shows #/today.
        today screen: meal (one per meal, with data-meal-id and data-status = pending | done | failed; pending means waiting or analyzing), today-kcal, today-kcal-target, today-protein, today-protein-target, today-carbs, today-carbs-target, today-fat, today-fat-target, quality (shows the day's average score as a number).
        meal screen: meal-name, field-grams, field-calories, field-protein, field-carbs, field-fat, field-fiber, field-time (inputs; a change is saved at once), meal-score, meal-confidence, correction-text, correction-send, retry (for a failed meal).
        notice: a visible message for the person, e.g. a photo with no food.
        trends screen: chart-kcal, chart-balance, chart-quality, chart-weight; each contains an svg and a text alternative (a table, a figcaption or an aria-label with the numbers).
        review screen: review-request, review-score, review-summary, review-strengths, review-issues, review-recommendations (lists use <li>).
        settings screen: provider (a select with values openai, google, anthropic), model, api-key, lang, export, delete-all. A confirmation, if any, uses window.confirm or a button with data-dna="confirm-yes".
      model_calls: "Calls go through window.fetch at the moment of the call, to the providers' official endpoints: OpenAI chat completions (https://api.openai.com/v1/chat/completions), Gemini generateContent (https://generativelanguage.googleapis.com/...:generateContent) and Anthropic messages (https://api.anthropic.com/v1/messages). The model answers JSON text; estimates follow x-estimation-rules.output and reviews follow {score, summary, strengths[], issues[], recommendations[]}. The estimator prompt includes every x-estimation-rules rule verbatim, in English. The review prompt names the person's language."
      service_worker: "sw.js declares CACHE_NAME and CACHE_FILES as literals (a string and an array of relative paths, index.html and manifest.json included)."
      same_in_all_languages: [Plate, kcal, g, kg, cm, CSV, API, OK, OpenAI, Google, Gemini, Google Gemini, Anthropic, Claude, Anthropic Claude, English, Español]
    lock_format: |
      Top-level keys of plate.dna.lock.yaml, besides the gene choices of spec 6.1:
      capsule_source: "<the raw URL of this capsule: for github.com/<o>/<r>/blob/<ref>/<p> use https://raw.githubusercontent.com/<o>/<r>/<ref>/<p>>"
      capsule_sha256: "<sha256 of the bytes at capsule_source>"
      models:
        - provider: openai
          model: "<id>"
          checked: true
          source: "<the page where the id was found, fetchable without a login>"
          date: "YYYY-MM-DD"
        (one entry each for openai, google and anthropic)
      conformance:
        rounds: [ {round, passed, failed, failing: [ids], fixed: "<what changed>"} ]
        result: "conforming" or "not conforming"
        disputes: [ {check, evidence, reasoning} ]
    kit:
      - path: tests/conformance.html
        content: |
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Plate conformance</title>
          <style>
          body{font:14px/1.4 system-ui,sans-serif;margin:16px;background:#fff;color:#111}
          #summary{font-weight:600;margin:8px 0}
          .pass{color:#0a7d2c}.fail{color:#b00020}.skip{color:#8a5a00}
          li{margin:2px 0}small{color:#555}
          iframe{position:fixed;right:0;bottom:0;width:420px;height:760px;border:1px solid #999;background:#fff}
          </style>
          </head>
          <body>
          <h1>Plate conformance kit</h1>
          <p>Runs the capsule's checks against <code>../index.html</code>. Serve the app folder over http://localhost; on file:// every check reports skipped.</p>
          <div id="summary">Running...</div>
          <ol id="results"></ol>
          <script src="conformance.js"></script>
          </body>
          </html>
      - path: tests/conformance.js
        content: |
          /* Plate conformance kit, browser part. Part of the capsule: copy verbatim, never edit.
             It drives ../index.html in an iframe through the contract in extensions.x-conformance.contract
             and reads only what a person sees or hears (the rendered document). */
          (function () {
            'use strict';

            var APP = '../index.html';
            var SCREENS = ['today', 'capture', 'trends', 'review', 'settings'];
            var LANGS = ['en', 'es'];
            var KEY = 'sk-dna-test-0000';
            var RULES = [
              "Readable nutrition label: values per 100 g × the real net weight; if only part was eaten, estimate the part",
              "Known commercial product without a readable label: use knowledge of the brand; never return 0 for a recognized product",
              "Food on a plate: estimate portion from visual references (spoon ≈ 15 g, 25 cm plate) and standard food tables (USDA, BEDCA); say if meat/fish weight is raw or cooked",
              "calories = 0 only when there is no food; then confidence = 0",
              "confidence > 0.85 label or well-known product; 0.6-0.85 identified but estimated; < 0.6 high uncertainty",
              "An error above 15 % in calories breaks the tracking: be decisive"
            ];
            var SAME_IN_ALL = ['Plate', 'kcal', 'g', 'kg', 'cm', 'CSV', 'API', 'OK', 'OpenAI', 'Google', 'Gemini', 'Google Gemini',
              'Anthropic', 'Claude', 'Anthropic Claude', 'English', 'Español', 'Xyzzy meal'];

            function est(desc, kcal, p, c, f, fib, score, conf) {
              return { description: desc, ingredients: [], totals: { grams: 350, calories: kcal, protein_g: p, carbs_g: c, fat_g: f, fiber_g: fib },
                health_score: score, health_reason: 'Fake estimate for the conformance kit', confidence: conf, notes: '' };
            }
            var PLATE = est('Grilled chicken with rice', 512, 42, 55, 12, 3, 4, 0.7);
            var HALF = est('Half grilled chicken with rice', 256, 21, 27, 6, 2, 4, 0.7);
            var NOT_FOOD = est('Not food', 0, 0, 0, 0, 0, 1, 0);
            var REVIEW = { score: 72, summary: 'Fake weekly summary', strengths: ['Fake strength one', 'Fake strength two'],
              issues: ['Fake issue'], recommendations: ['Fake rec one', 'Fake rec two', 'Fake rec three', 'Fake rec four'] };

            var out = document.getElementById('results');
            var results = [];
            var F, W, D;
            var FAKE = { queue: [], calls: [] };

            function record(id, title, status, detail) {
              results.push({ id: id, title: title, status: status, detail: detail || '' });
              var li = document.createElement('li');
              li.className = status;
              li.textContent = status.toUpperCase() + ' ' + id + ' ' + title + (detail ? ' :: ' + detail : '');
              out.appendChild(li);
            }
            function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
            async function waitFor(fn, ms, what) {
              var t0 = Date.now();
              while (Date.now() - t0 < ms) {
                try { var v = fn(); if (v) return v; } catch (e) { /* keep waiting */ }
                await sleep(50);
              }
              throw new Error('timed out waiting for ' + what);
            }
            function hook(name, root) { return (root || D).querySelector('[data-dna="' + name + '"]'); }
            function hooks(name, root) { return Array.prototype.slice.call((root || D).querySelectorAll('[data-dna="' + name + '"]')); }
            function visible(el) {
              if (!el || !el.isConnected) return false;
              if (el.closest('[hidden],[aria-hidden="true"]')) return false;
              var cs = W.getComputedStyle(el);
              if (cs.display === 'none' || cs.visibility === 'hidden') return false;
              return el.getClientRects().length > 0;
            }
            function need(name, root) {
              var el = hook(name, root);
              if (!el) throw new Error('missing [data-dna="' + name + '"]');
              return el;
            }
            function text(el) { return ((el && (el.value !== undefined && el.tagName !== 'BUTTON' ? el.value : el.textContent)) || '').trim(); }
            function num(el) {
              var m = text(el).replace(/\s/g, '').replace(/(\d)[.,](\d{3})(?!\d)/g, '$1$2').replace(',', '.').match(/-?\d+(\.\d+)?/);
              return m ? parseFloat(m[0]) : NaN;
            }
            function near(a, b, tol) { return Math.abs(a - b) <= tol; }

            function wrap(host, payloadText) {
              if (/openai/.test(host)) return { id: 'fake', object: 'chat.completion', choices: [{ index: 0, message: { role: 'assistant', content: payloadText }, finish_reason: 'stop' }] };
              if (/googleapis/.test(host)) return { candidates: [{ content: { role: 'model', parts: [{ text: payloadText }] }, finishReason: 'STOP' }] };
              return { id: 'fake', type: 'message', role: 'assistant', content: [{ type: 'text', text: payloadText }], stop_reason: 'end_turn' };
            }
