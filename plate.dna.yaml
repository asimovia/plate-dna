              });
              D.querySelectorAll('[aria-labelledby],[aria-describedby]').forEach(function (e) {
                ((e.getAttribute('aria-labelledby') || '') + ' ' + (e.getAttribute('aria-describedby') || '')).split(/\s+/).forEach(function (x) { var t = x && D.getElementById(x); if (t && t.textContent.trim()) set[t.textContent.trim()] = 1; });
              });
              if (D.title) set[D.title.trim()] = 1;
              return set;
            }
            function neutral(s) {
              if (SAME_IN_ALL.indexOf(s) >= 0) return true;
              if (s.replace(/[^A-Za-zÀ-ÿ]/g, '').length < 3) return true;
              if (/^[\d\s.,:;%/()+\-–·×]*(kcal|g|kg|cm|%)?[\d\s.,:;%/()+\-–·×]*$/i.test(s)) return true;
              if (/^[a-z0-9.\-]+$/.test(s) && /\d/.test(s)) return true;
              return false;
            }
            function accName(e) {
              var n = e.getAttribute('aria-label') || '';
              if (!n && e.getAttribute('aria-labelledby')) n = e.getAttribute('aria-labelledby').split(/\s+/).map(function (x) { var t = D.getElementById(x); return t ? t.textContent : ''; }).join(' ');
              if (!n && e.labels && e.labels.length) n = Array.prototype.map.call(e.labels, function (l) { return l.textContent; }).join(' ');
              if (!n && e.tagName !== 'INPUT' && e.tagName !== 'SELECT' && e.tagName !== 'TEXTAREA') n = e.textContent;
              if (!n) n = e.getAttribute('title') || e.getAttribute('alt') || '';
              return n.trim();
            }
            async function tour(lang) {
              await fresh({ profile: profile(), settings: settings(), meals: [meal(0, 500, 3), meal(1, 600, 4)] }, lang);
              if ((D.documentElement.getAttribute('lang') || '').slice(0, 2) !== lang) throw new Error('<html lang> is "' + D.documentElement.getAttribute('lang') + '" with ?lang=' + lang);
              var strings = {}, problems = [];
              var routes = SCREENS.concat(['meal/' + meals()[0].getAttribute('data-meal-id')]);
              for (var i = 0; i < routes.length; i++) {
                var s = await go(routes[i]);
                var sid = routes[i].split('/')[0];
                var hd = s.querySelector('h1,h2,[role="heading"]');
                if (!hd || !visible(hd) || !hd.textContent.trim()) problems.push('screen ' + sid + ' has no visible heading');
                else {
                  var first = s.querySelector('button,input,select,textarea,a[href],[tabindex]');
                  if (first && first !== hd && (hd.compareDocumentPosition(first) & 2)) problems.push('screen ' + sid + ' does not start with its heading');
                }
                D.querySelectorAll('button,a[href],input,select,textarea,[tabindex]').forEach(function (e) {
                  if (e.type === 'hidden' || e.disabled) return;
                  var focusable = e.tabIndex >= 0 && !e.closest('[hidden],[aria-hidden="true"],[inert]') && W.getComputedStyle(e).display !== 'none' && W.getComputedStyle(e).visibility !== 'hidden';
                  if (focusable && !accName(e)) problems.push('no accessible name on ' + sid + ': ' + e.outerHTML.slice(0, 90));
                });
                var got = collectStrings(); for (var k in got) strings[k] = 1;
              }
              return { strings: strings, problems: problems };
            }
            check('I18N.1', 'Every screen in en and es: nothing left in the other language', async function () {
              var en = await tour('en'), es = await tour('es');
              var leaks = Object.keys(es.strings).filter(function (s) { return en.strings[s] && !neutral(s); });
              if (leaks.length) throw new Error(leaks.length + ' string(s) identical in en and es, e.g. "' + leaks.slice(0, 4).join('", "') + '"');
            });
            check('A11Y.1', 'Every screen starts with a heading and every control has a name, in both languages', async function () {
              var all = [];
              for (var i = 0; i < LANGS.length; i++) { var r = await tour(LANGS[i]); r.problems.forEach(function (p) { all.push(LANGS[i] + ': ' + p); }); }
              var uniq = all.filter(function (p, i) { return all.indexOf(p) === i; });
              if (uniq.length) throw new Error(uniq.length + ' problem(s): ' + uniq.slice(0, 3).join(' | '));
            });

            async function run() {
              if (location.protocol === 'file:') {
                CHECKS.forEach(function (c) { record(c.id, c.title, 'skip', 'serve over http://localhost'); });
              } else {
                for (var i = 0; i < CHECKS.length; i++) {
                  var c = CHECKS[i];
                  try {
                    await Promise.race([c.fn(), sleep(90000).then(function () { throw new Error('check timed out after 90 s'); })]);
                    record(c.id, c.title, 'pass');
                  } catch (e) { record(c.id, c.title, 'fail', e && e.message ? e.message : String(e)); }
                }
              }
              var count = function (s) { return results.filter(function (r) { return r.status === s; }).length; };
              var sum = count('pass') + ' passed, ' + count('fail') + ' failed, ' + count('skip') + ' skipped, ' + results.length + ' total';
              document.getElementById('summary').textContent = sum;
              window.__conformance = { done: true, summary: sum, results: results };
            }
            window.__conformance = { done: false, results: results };
            run();
          })();
      - path: tests/conformance.mjs
        content: |
          // Plate conformance kit, node part. Part of the capsule: copy verbatim, never edit.
          // Run from the app folder: node tests/conformance.mjs
          // 1. Checks on disk and on the web: kit integrity, capsule hash in the lock, cache name, model sources.
          // 2. The browser part: serves the folder on localhost, opens tests/conformance.html in headless
          //    Chromium (playwright) and prints its results.
          // Exit code 0 only when every check passes and none is skipped.
          import { readFileSync, existsSync, statSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { createServer } from 'node:http';
          import { join, extname, resolve, dirname } from 'node:path';
          import { fileURLToPath } from 'node:url';

          const ROOT = resolve(dirname(fileURLToPath(import.meta.url)), '..');
          const LOCK = join(ROOT, 'plate.dna.lock.yaml');
          const UA = { 'user-agent': 'Mozilla/5.0 (DNApps conformance kit)' };
          const results = [];
          const rec = (id, title, status, detail = '') => {
            results.push({ id, title, status, detail });
            console.log(`${status.toUpperCase().padEnd(4)} ${id} ${title}${detail ? ' :: ' + detail : ''}`);
          };
          const sha256 = (buf) => createHash('sha256').update(buf).digest('hex');
          const norm = (t) => t.replace(/\r\n/g, '\n').split('\n').map((l) => l.replace(/\s+$/, '')).join('\n').replace(/\n+$/, '');

          async function get(url) {
            const r = await fetch(url, { headers: UA, redirect: 'follow' });
            if (!r.ok) throw new Error(`${url} answered HTTP ${r.status}`);
            return Buffer.from(await r.arrayBuffer());
          }
          function top(lock, key) {
            const m = lock.match(new RegExp(`^${key}:\\s*"?([^"\\n]+?)"?\\s*$`, 'm'));
            return m ? m[1].trim() : null;
          }
          function block(text, key) {
            const lines = text.split('\n');
            const i = lines.findIndex((l) => l.startsWith(`${key}:`));
            if (i < 0) return [];
            const out = [];
            for (let j = i + 1; j < lines.length; j++) {
              if (lines[j].trim() && !/^\s/.test(lines[j])) break;
              out.push(lines[j]);
            }
            return out;
          }
          function models(lock) {
            const list = [];
            let cur = null;
            for (const l of block(lock, 'models')) {
              const item = l.match(/^\s*-\s+(\w+):\s*"?([^"]*?)"?\s*$/);
              const field = l.match(/^\s+(\w+):\s*"?([^"]*?)"?\s*$/);
              if (item) { cur = { [item[1]]: item[2] }; list.push(cur); } else if (field && cur) cur[field[1]] = field[2];
            }
            return list;
          }
          function kitFromCapsule(capsule) {
            const lines = capsule.split('\n');
            const files = {};
            for (let i = 0; i < lines.length; i++) {
              const p = lines[i].match(/^(\s*)- path:\s*"?([^"\s]+)"?\s*$/);
              if (!p || !/^tests\/conformance\./.test(p[2])) continue;
              const c = lines[i + 1] && lines[i + 1].match(/^(\s*)content:\s*\|[-+]?\s*$/);
              if (!c) continue;
              const body = [];
              let indent = null;
              for (let j = i + 2; j < lines.length; j++) {
                const l = lines[j];
                if (l.trim() === '') { body.push(''); continue; }
                const lead = l.match(/^ */)[0].length;
                if (indent === null) indent = lead;
                if (lead < indent) break;
                body.push(l.slice(indent));
              }
              files[p[2]] = body.join('\n');
            }
            return files;
          }

          async function diskChecks() {
            if (!existsSync(LOCK)) { rec('LOCK.0', 'plate.dna.lock.yaml exists', 'fail', 'missing'); return; }
            const lock = readFileSync(LOCK, 'utf8');
            const source = top(lock, 'capsule_source');
            const declared = top(lock, 'capsule_sha256');
            let capsule = null;
            try {
              if (!source || !/^https:\/\/raw\.githubusercontent\.com\//.test(source)) throw new Error(`capsule_source must be the raw.githubusercontent.com URL of the capsule, got ${source}`);
              const bytes = await get(source);
              capsule = bytes.toString('utf8');
              const real = sha256(bytes);
              if (declared !== real) throw new Error(`lock says ${declared}, the bytes at capsule_source hash to ${real}`);
              rec('LOCK.1', 'capsule_sha256 is the sha256 of the capsule at capsule_source', 'pass');
            } catch (e) { rec('LOCK.1', 'capsule_sha256 is the sha256 of the capsule at capsule_source', 'fail', e.message); }

            if (capsule) {
              const kit = kitFromCapsule(capsule);
              const names = Object.keys(kit);
              const bad = names.filter((n) => !existsSync(join(ROOT, n)) || norm(readFileSync(join(ROOT, n), 'utf8')) !== norm(kit[n]));
              if (names.length < 3) rec('KIT.1', 'Kit files match the capsule byte for byte', 'fail', `found ${names.length} kit files in the capsule`);
              else rec('KIT.1', 'Kit files match the capsule byte for byte', bad.length ? 'fail' : 'pass', bad.length ? `edited or missing: ${bad.join(', ')}` : '');
            } else rec('KIT.1', 'Kit files match the capsule byte for byte', 'skip', 'capsule not available');

            try {
              const sw = readFileSync(join(ROOT, 'sw.js'), 'utf8');
              const name = (sw.match(/CACHE_NAME\s*=\s*['"]([^'"]+)['"]/) || [])[1];
              const list = (sw.match(/CACHE_FILES\s*=\s*\[([\s\S]*?)\]/) || [])[1];
              if (!name || list === undefined) throw new Error('sw.js must declare CACHE_NAME = \'...\' and CACHE_FILES = [...] as literals');
              const files = [...list.matchAll(/['"]([^'"]+)['"]/g)].map((m) => m[1]);
              const h = createHash('sha256');
              for (const f of files) {
                const p = join(ROOT, f === './' || f === '' ? 'index.html' : f.replace(/^\.\//, ''));
                if (!existsSync(p) || !statSync(p).isFile()) throw new Error(`CACHE_FILES lists ${f}, which is not a file`);
                h.update(readFileSync(p));
              }
              for (const must of ['index.html', 'manifest.json']) if (!files.some((f) => f.replace(/^\.\//, '') === must)) throw new Error(`CACHE_FILES does not list ${must}`);
              const version = capsule ? (capsule.match(/^identity:[\s\S]*?^\s+version:\s*"([^"]+)"/m) || [])[1] : null;
              const want = `plate-${version || '<version>'}-${h.digest('hex').slice(0, 12)}`;
              if (!version) throw new Error(`cannot read identity.version from the capsule; expected ${want}`);
              if (name !== want) throw new Error(`CACHE_NAME is ${name}, expected ${want}`);
              rec('F9.3', 'Cache name is plate-<version>-<hash of the cached files>', 'pass');
            } catch (e) { rec('F9.3', 'Cache name is plate-<version>-<hash of the cached files>', 'fail', e.message); }

            const ms = models(lock);
            for (const provider of ['openai', 'google', 'anthropic']) {
              const id = `MODEL.${provider}`;
              const m = ms.find((x) => x.provider === provider);
              const title = `${provider}: default model looked up on the web, with source and date`;
              if (!m || !m.model) { rec(id, title, 'fail', 'no entry under models:'); continue; }
              if (m.checked !== 'true') { rec(id, title, 'fail', `checked is ${m.checked}; look it up (tried URL and error go in the lock only if every lookup fails)`); continue; }
              if (!/^https?:\/\//.test(m.source || '') || !/^\d{4}-\d{2}-\d{2}$/.test(m.date || '')) { rec(id, title, 'fail', 'checked: true needs source: <url> and date: YYYY-MM-DD'); continue; }
              try {
                const page = (await get(m.source)).toString('utf8');
                if (!page.includes(m.model)) throw new Error(`${m.model} does not appear at ${m.source}`);
                rec(id, title, 'pass', m.model);
              } catch (e) { rec(id, title, 'fail', e.message); }
            }
          }

          const TYPES = { '.html': 'text/html; charset=utf-8', '.js': 'text/javascript; charset=utf-8', '.mjs': 'text/javascript; charset=utf-8',
            '.css': 'text/css; charset=utf-8', '.json': 'application/json', '.webmanifest': 'application/manifest+json', '.svg': 'image/svg+xml',
            '.png': 'image/png', '.jpg': 'image/jpeg', '.ico': 'image/x-icon', '.yaml': 'text/yaml; charset=utf-8' };

          async function browserChecks() {
            let chromium;
            try { ({ chromium } = await import('playwright')); } catch {
              rec('BROWSER', 'Browser part of the kit', 'skip', 'playwright is not installed: run `npm i --no-save playwright && npx playwright install chromium` in this folder, then run this again');
              return;
            }
            const server = createServer((req, res) => {
              const path = decodeURIComponent(new URL(req.url, 'http://x').pathname);
              let file = join(ROOT, path.endsWith('/') ? path + 'index.html' : path);
              if (!file.startsWith(ROOT) || !existsSync(file) || !statSync(file).isFile()) { res.writeHead(404); res.end('not found'); return; }
              res.writeHead(200, { 'content-type': TYPES[extname(file)] || 'application/octet-stream', 'cache-control': 'no-store' });
              res.end(readFileSync(file));
            });
            await new Promise((r) => server.listen(0, '127.0.0.1', r));
            const port = server.address().port;
            let browser;
            try {
              browser = await chromium.launch();
              const page = await (await browser.newContext({ locale: 'en-US' })).newPage();
              page.on('pageerror', (e) => console.log(`     app error: ${e.message}`));
              await page.goto(`http://localhost:${port}/tests/conformance.html`);
              await page.waitForFunction(() => window.__conformance && window.__conformance.done, null, { timeout: 30 * 60 * 1000 });
              const r = await page.evaluate(() => window.__conformance.results);
              for (const x of r) rec(x.id, x.title, x.status, x.detail);
            } catch (e) {
              rec('BROWSER', 'Browser part of the kit', 'fail', e.message);
            } finally {
              if (browser) await browser.close();
              server.close();
            }
          }

          await diskChecks();
          await browserChecks();
          const n = (s) => results.filter((r) => r.status === s).length;
          console.log(`\n${n('pass')} passed, ${n('fail')} failed, ${n('skip')} skipped, ${results.length} total`);
          process.exit(n('fail') || n('skip') ? 1 : 0);

rna:
  phases:
    - id: P1
      title: "Local core"
      tasks:
        - { id: T1, do: "Meal, Profile, WeightEntry and Review models in IndexedDB", done_when: "Unit tests pass for create, list by day, update and delete" }
        - { id: T2, do: "Profile and goal → daily targets", needs: [T1], done_when: "Unit tests pass for gain, lose and maintain against hand-computed values" }
    - id: P2
      title: "Capture"
      needs: [P1]
      tasks:
        - { id: T3, do: "Estimator client: provider/model/key settings, prompt with x-estimation-rules, JSON parsing tolerant of code fences", done_when: "F1 passes on the three fixtures" }
        - { id: T4, do: "Capture screen: camera/gallery, words, dictation, on-device downscale, pending → done/failed", needs: [T3], done_when: "F1, F2 and F3 pass" }
        - { id: T5, do: "Meal screen: edit, correction re-analysis, retry", needs: [T4], done_when: "F4 passes" }
    - id: P3
      title: "Today and trends"
      needs: [P1]
      tasks:
        - { id: T6, do: "Today screen with targets, macros and the quality bar", done_when: "F5 passes" }
        - { id: T7, do: "Trends: three 30-day SVG charts with text alternatives, plus weight", needs: [T6], done_when: "F6 passes, including with a screen reader" }
    - id: P4
      title: "Weekly review"
      needs: [P2]
      tasks:
        - { id: T8, do: "Review from the last 7 days through the same model, stored with its history", done_when: "F7 passes in two languages" }
    - id: P5
      title: "Ownership and install"
      needs: [P1]
      tasks:
        - { id: T9, do: "CSV export and delete-everything", done_when: "F8 passes" }
        - { id: T10, do: "Web App Manifest, icons, offline-first service worker and an offline queue for pending analyses", done_when: "F9 passes" }
